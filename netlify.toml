[build]
  command = "pnpm --filter @court/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/court"
  to = "/.netlify/functions/court"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/court"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/court"
  status = 200

[[redirects]]
  from = "/api/oracle"
  to = "/.netlify/functions/court"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
